name: Mirror a GitLab


on:
  push:
    branches: ['**']


jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Push a GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@git.icgb.com.ar/cliente-hogar-de-cristo/vicaria-hogar-misericordia.git
          git push gitlab HEAD:refs/heads/${{ github.ref_name }}
