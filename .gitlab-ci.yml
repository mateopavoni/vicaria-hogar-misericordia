# Pipeline del monorepo de Vicaria (backend .NET 9 + frontend Angular en un solo repo)
# Los TODO se completan cuando el DevOps de Encode defina el runner y el servidor.

stages:
  - build
  - test
  - smoke_test
  - deploy

build:
  stage: build
  # TODO: agregar "tags:" cuando se defina el tag del runner
  # Necesita Docker en el runner. Compila las imágenes de api y web definidas en backend/docker-compose.yml.
  # MSSQL_SA_PASSWORD, JWT_KEY y FRONTEND_PATH se toman de Settings > CI/CD > Variables.
  script:
    - cd backend && docker compose build

test:
  stage: test
  # TODO: agregar "tags:" cuando se defina el tag del runner
  # Necesita .NET SDK 9 en el runner (o definir "image:" según el executor).
  script:
    - cd backend && dotnet test tests/Vicaria.UnitTests
