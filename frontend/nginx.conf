server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # headers de seguridad (el CSP permite los estilos inline que emite Angular)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass https://vicaria-api.mateopavoni.com.ar/api/;
        proxy_set_header Host vicaria-api.mateopavoni.com.ar;
        proxy_ssl_server_name on;
    }

    # SPA: cualquier ruta que no exista como archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
