server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # en localhost las cookies de otros proyectos locales (otros puertos) viajan en cada request
    # y pasan el limite default de nginx (8k) -> "400 Request Header Or Cookie Too Large"
    large_client_header_buffers 4 32k;

    # Local (docker-compose): la API vive en el servicio "api" de la misma red de compose,
    # no en el dominio de produccion (ver nginx.conf para ese caso).
    # headers de seguridad (el CSP permite los estilos inline que emite Angular)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
    }

    # SPA: cualquier ruta que no exista como archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
