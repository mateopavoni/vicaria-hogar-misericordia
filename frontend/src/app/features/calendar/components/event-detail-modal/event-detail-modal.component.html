<ui-modal title="Detalle del evento" size="sm" (closed)="onClose()">
  <div class="flex flex-col gap-4">
    <div>
      <p class="text-[18px] font-bold text-slate-800">{{ event().title }}</p>
      <p class="mt-1 text-[13px] font-semibold text-[#6B8DF5]">{{ schedule() }}</p>
    </div>

    @if (event().description) {
      <div>
        <p class="mb-1 text-[12px] font-semibold text-slate-500">Descripción</p>
        <p class="text-[13px] text-slate-700">{{ event().description }}</p>
      </div>
    }

    <div class="border-t border-slate-100 pt-3">
      <p class="text-[12px] font-semibold text-slate-500">Autor</p>
      @if (event().isRecurring) {
        <span class="mt-1 inline-block rounded-full bg-[#EDF2FF] px-3 py-1 text-[12px] font-semibold text-[#6B8DF5]">
          {{ event().authorName }}
        </span>
      } @else {
        <p class="text-[13px] text-slate-700">{{ event().authorName }}</p>
      }
    </div>
  </div>

  <ng-container ngProjectAs="[modal-footer]">
    <button uiButton variant="secondary" type="button" (click)="onClose()">Cerrar</button>
    @if (canEdit() && !event().isRecurring) {
      <button uiButton type="button" (click)="onEdit()">Editar</button>
    }
  </ng-container>
</ui-modal>
