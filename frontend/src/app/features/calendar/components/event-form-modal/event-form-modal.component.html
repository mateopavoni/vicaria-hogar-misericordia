<ui-modal [title]="title()" size="sm" [closeOnBackdrop]="false" (closed)="onClose()">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

    <ui-form-field label="Título" for="event-title" [required]="true" [error]="titleError">
      <input id="event-title" uiInput type="text" formControlName="title" placeholder="Ej: Reunión de equipo" maxlength="150" />
    </ui-form-field>

    <ui-form-field label="Fecha" for="event-date" [required]="true" [error]="dateError">
      <input id="event-date" uiInput type="date" formControlName="date" />
    </ui-form-field>

    <div class="grid grid-cols-2 gap-4">
      <ui-form-field label="Hora inicio" for="event-start-time" [required]="true" [error]="timeRangeError">
        <input id="event-start-time" uiInput type="time" formControlName="startTime" />
      </ui-form-field>

      <ui-form-field label="Hora fin" for="event-end-time" [required]="true">
        <input id="event-end-time" uiInput type="time" formControlName="endTime" />
      </ui-form-field>
    </div>

    <ui-form-field label="Descripción" for="event-description" [error]="descriptionError">
      <textarea id="event-description" uiInput formControlName="description" rows="3" maxlength="500" placeholder="Opcional"></textarea>
    </ui-form-field>

    <ui-form-field label="Repetir" for="event-recurrence">
      <select id="event-recurrence" uiInput formControlName="recurrence">
        @for (option of recurrenceOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </ui-form-field>

    @if (errorMessage()) {
      <p class="text-[12px] font-semibold text-rose-500" role="alert">{{ errorMessage() }}</p>
    }
  </form>

  <ng-container ngProjectAs="[modal-footer]">
    <button uiButton variant="secondary" type="button" [disabled]="saving()" (click)="onClose()">Cancelar</button>
    <button uiButton type="button" [loading]="saving()" [disabled]="saving()" (click)="submit()">Guardar</button>
  </ng-container>
</ui-modal>
