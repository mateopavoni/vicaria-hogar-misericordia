<div class="rounded-xl border border-[#E3E8F5] bg-white p-5">

  <div class="mb-4">
    <h3 class="text-[14px] font-semibold text-slate-700">
      Filtros
    </h3>

    <p class="text-[12px] text-slate-400">
      Refiná la búsqueda de colaboradores.
    </p>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="applyFilters()"
    class="flex flex-wrap items-center justify-between gap-4"
  >

    <!-- Tipo: 3 checkboxes mutuamente excluyentes en línea -->
    <div class="flex items-center gap-5">
      <label class="flex items-center gap-2 text-[13px] font-medium text-slate-700">
        <input
          type="checkbox"
          formControlName="all"
          (change)="selectOption('all')"
          class="h-4 w-4 rounded border-[#D5DDF3] text-[#6B8DF5] focus:ring-[#6B8DF5]"
        />
        Todos
      </label>

      <label class="flex items-center gap-2 text-[13px] font-medium text-slate-700">
        <input
          type="checkbox"
          formControlName="volunteer"
          (change)="selectOption('volunteer')"
          class="h-4 w-4 rounded border-[#D5DDF3] text-[#6B8DF5] focus:ring-[#6B8DF5]"
        />
        Solo voluntarios
      </label>

      <label class="flex items-center gap-2 text-[13px] font-medium text-slate-700">
        <input
          type="checkbox"
          formControlName="employee"
          (change)="selectOption('employee')"
          class="h-4 w-4 rounded border-[#D5DDF3] text-[#6B8DF5] focus:ring-[#6B8DF5]"
        />
        Solo empleados
      </label>
    </div>

    <div class="flex gap-2">
      <button
        type="button"
        (click)="clearFilters()"
        class="h-[40px] rounded-lg border border-slate-200 bg-white px-4 text-sm font-medium text-slate-600 hover:bg-slate-50"
      >
        Limpiar filtros
      </button>

      <button
        type="submit"
        class="h-[40px] rounded-md bg-[#6B8DF5] px-5 text-[13px] font-semibold text-white hover:bg-[#4167D9]"
      >
        Aplicar filtros
      </button>
    </div>

  </form>

</div>
