<ui-modal title="Registrar ingreso de medicamento" size="sm" [closeOnBackdrop]="false" (closed)="onClose()">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

    <ui-form-field label="Medicamento" for="entry-medication" [required]="true" [error]="medicationError">
      <select id="entry-medication" uiInput formControlName="medication">
        <option value="" disabled>Elegí un medicamento</option>
        @for (item of items(); track item.id) {
          <option [value]="item.id">{{ item.name }}</option>
        }
        <option [value]="newOption">+ Medicamento nuevo</option>
      </select>
    </ui-form-field>

    @if (isNew()) {
      <ui-form-field label="Nombre del medicamento nuevo" for="entry-new-name" [required]="true" [error]="newNameError">
        <input id="entry-new-name" uiInput type="text" formControlName="newName" maxlength="100" />
      </ui-form-field>
    }

    <ui-form-field label="Cantidad" for="entry-quantity" [required]="true" [error]="quantityError">
      <input id="entry-quantity" uiInput type="number" min="1" step="1" formControlName="quantity" />
    </ui-form-field>

    <ui-form-field label="Fecha de vencimiento" for="entry-expiration" [required]="true" [error]="expirationError">
      <input id="entry-expiration" uiInput type="date" formControlName="expirationDate" [attr.min]="today" />
    </ui-form-field>

    <ui-form-field label="Proveedor" for="entry-supplier" [required]="true" [error]="supplierError">
      <input id="entry-supplier" uiInput type="text" formControlName="supplier" maxlength="100" />
    </ui-form-field>

    @if (errorMessage()) {
      <p class="text-[12px] font-semibold text-rose-500" role="alert">{{ errorMessage() }}</p>
    }
  </form>

  <ng-container ngProjectAs="[modal-footer]">
    <button uiButton variant="secondary" type="button" [disabled]="saving()" (click)="onClose()">Cancelar</button>
    <button uiButton type="button" [loading]="saving()" [disabled]="saving()" (click)="submit()">Registrar ingreso</button>
  </ng-container>
</ui-modal>
