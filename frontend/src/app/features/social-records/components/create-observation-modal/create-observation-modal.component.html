
   <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
      <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100">
        
        <!-- Header del Modal -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <h3 class="text-lg font-bold text-slate-800">
            Nueva Observación
          </h3>
          <button
            type="button"
            (click)="cancel.emit()"
            class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors"
          >
            ✕
          </button>
        </div>

        <form [formGroup]="observationForm" (ngSubmit)="save()" class="mt-4 space-y-4">
          <!-- Selector Opcional de Categoría -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">
              Categoría <span class="text-slate-400 font-normal">(Opcional)</span>
            </label>
            <select
              formControlName="categoryId"
              class="w-full rounded-xl border border-slate-300 p-2.5 text-sm text-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none"
            >
              <option [value]="null">Sin categoría (General)</option>
              @for (category of activeCategories(); track category.id) {
                <option [value]="category.id">{{ category.name }}</option>
              }
            </select>
          </div>

          <!-- Textarea Obligatorio de Observación -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">
              Observación *
            </label>
            <textarea
              formControlName="content"
              rows="5"
              placeholder="Escribe aquí los detalles del seguimiento..."
              class="w-full rounded-xl border border-slate-300 p-3 text-sm text-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none"
            ></textarea>

            @if (observationForm.controls.content.invalid && observationForm.controls.content.touched) {
              <p class="mt-1 text-xs text-rose-500">
                La observación no puede estar vacía.
              </p>
            }
          </div>

          <!-- Mensaje de Error General -->
          @if (errorMessage()) {
            <div class="p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl text-xs">
              {{ errorMessage() }}
            </div>
          }

          <!-- Botones de Acción -->
          <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
            <button
              type="button"
              (click)="cancel.emit()"
              class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors"
            >
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="observationForm.invalid || submitting()"
              class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50 transition-colors flex items-center gap-2"
            >
              @if (submitting()) {
                <span class="animate-spin text-xs">⏳</span> Guardando...
              } @else {
                Guardar Observación
              }
            </button>
          </div>
        </form>

      </div>
    </div>
