<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl border border-slate-200">
    
    <div class="mb-4 flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="text-base font-bold text-slate-800">Registrar Egreso de la Casona</h3>
      <button (click)="cancel.emit()" class="text-slate-400 hover:text-slate-600">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      
      <!-- FECHA DE EGRESO -->
      <div>
        <label class="block text-xs font-semibold text-slate-600">Fecha de Egreso *</label>
        <input
          type="date"
          formControlName="exitDate"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-[#4167D9] focus:outline-none"
        />
      </div>

      <!-- MOTIVO DE EGRESO -->
      <div>
        <label class="block text-xs font-semibold text-slate-600">Motivo de Egreso *</label>
        <select
          formControlName="exitReason"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-[#4167D9] focus:outline-none"
        >
          <option value="Alta voluntaria">Alta voluntaria</option>
          <option value="Derivación">Derivación</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <!-- TEXTAREA CONDICIONAL PARA "OTRO" -->
      @if (form.controls.exitReason.value === 'Otro') {
        <div>
          <label class="block text-xs font-semibold text-slate-600">Especifique el motivo *</label>
          <textarea
            formControlName="exitDetail"
            rows="3"
            class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 text-xs focus:border-[#4167D9] focus:outline-none"
            placeholder="Detalle los motivos del egreso..."
          ></textarea>
          @if (form.controls.exitDetail.touched && form.controls.exitDetail.invalid) {
            <p class="mt-1 text-[11px] text-rose-500">Debe especificar el motivo del egreso.</p>
          }
        </div>
      }

      <!-- ACCIONES -->
      <div class="mt-6 flex justify-end gap-3 pt-3 border-t border-slate-100">
        <button
          type="button"
          (click)="cancel.emit()"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="rounded-lg bg-rose-600 px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-rose-700"
        >
          Confirmar Egreso
        </button>
      </div>

    </form>
  </div>
</div>
