<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl border border-slate-200">
    
    <!-- ENCABEZADO -->
    <div class="mb-4 flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="text-base font-bold text-slate-800">Registrar Ingreso a la Casona</h3>
      <button 
        type="button" 
        (click)="cancel.emit()" 
        class="text-slate-400 hover:text-slate-600 transition"
      >
        ✕
      </button>
    </div>

    <!-- FORMULARIO -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      
      <!-- FECHA DE INGRESO -->
      <div>
        <label class="block text-xs font-semibold text-slate-600">Fecha de Ingreso *</label>
        <input
          type="date"
          formControlName="entryDate"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-[#4167D9] focus:outline-none"
        />
        @if (form.controls.entryDate.touched && form.controls.entryDate.invalid) {
          <p class="mt-1 text-[11px] text-rose-500">Debe seleccionar una fecha de ingreso válida.</p>
        }
      </div>

      <p class="text-[11px] text-slate-500 italic">
        Al confirmar, la persona pasará a tipo <strong>Residente</strong> y se iniciará un nuevo período de estadía en la línea de tiempo.
      </p>

      <!-- BOTONES DE ACCIÓN -->
      <div class="mt-6 flex justify-end gap-3 pt-3 border-t border-slate-100">
        <button
          type="button"
          (click)="cancel.emit()"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="rounded-lg bg-emerald-600 px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-emerald-700 transition"
        >
          Confirmar Ingreso
        </button>
      </div>

    </form>
  </div>
</div>
