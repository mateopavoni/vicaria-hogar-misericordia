<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Editar Ficha </h1>

  @if (loading()) {
    <div class="p-4 text-center">Cargando datos de la ficha...</div>
  } @else if (errorMessage()) {
    <div class="p-3 mb-4 text-red-700 bg-red-100 rounded-lg">
      {{ errorMessage() }}
    </div>
  } @else {
    <app-social-record-form
      mode="edit"
      [initialData]="record()"
      [loading]="saving()"
      (submittedForm)="updateRecord($event)"
    />
  }

  <!-- confirmación de salir sin guardar (reemplaza al confirm() nativo de pendingChangesGuard) -->
  @if (confirmingLeave()) {
    <ui-confirm-dialog
      title="Cambios sin guardar"
      message="Tenés cambios sin guardar. ¿Estás seguro de que querés salir de la página?"
      confirmLabel="Salir sin guardar"
      confirmVariant="warning"
      (confirmed)="confirmLeave()"
      (cancelled)="cancelLeave()"
    />
  }

  <!-- aviso de guardado exitoso (antes era un cartel verde inline, fácil de pasar por alto) -->
  @if (showSuccessModal()) {
    <app-success-modal
      title="¡Ficha actualizada!"
      message="Los cambios se guardaron correctamente."
      (close)="closeSuccessModal()"
    />
  }
</div>
