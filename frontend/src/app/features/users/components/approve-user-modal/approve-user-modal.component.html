<ui-modal
  title="Aprobar usuario"
  subtitle="Asigná un rol para habilitar el acceso al sistema."
  (closed)="closeModal()"
>
  @if (user) {
    <!-- DATOS DEL USUARIO -->
    <div class="mb-6 rounded-xl bg-[#F7F8FC] px-4 py-3">
      <p class="text-[12px] font-bold text-slate-700">{{ user.name }} {{ user.lastname }}</p>
      <p class="mt-1 text-[10px] text-slate-400">{{ user.email }}</p>
    </div>

    <!-- ROL -->
    <div role="radiogroup" aria-labelledby="approve-role-label">
      <p id="approve-role-label" class="mb-2 block text-[12px] font-semibold text-slate-700">Asignar rol</p>

      <div class="space-y-2">
        @for (role of roles; track role) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="selectedRole() === role"
            (click)="selectRole(role)"
            class="flex w-full items-center justify-between rounded-lg border px-4 py-3 text-left transition"
            [class]="selectedRole() === role ? 'border-[#6B8DF5] bg-[#EDF2FF]' : 'border-[#E3E8F5] bg-white'"
          >
            <span
              class="text-[12px] font-semibold"
              [class]="selectedRole() === role ? 'text-[#4167D9]' : 'text-slate-700'"
            >
              {{ roleLabel(role) }}
            </span>

            @if (selectedRole() === role) {
              <span class="flex h-5 w-5 items-center justify-center rounded-full bg-[#6B8DF5] text-white">
                <svg class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path d="M5 12l4 4L19 7" />
                </svg>
              </span>
            }
          </button>
        }
      </div>
    </div>
  }

  <ng-container ngProjectAs="[modal-footer]">
    <button uiButton variant="secondary" type="button" (click)="closeModal()">Cancelar</button>
    <button uiButton type="button" [disabled]="!selectedRole()" (click)="approveUser()">
      Aprobar usuario
    </button>
  </ng-container>
</ui-modal>
