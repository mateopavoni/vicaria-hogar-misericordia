<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
      <div class="w-full max-w-md rounded-2xl border border-slate-100 bg-white p-6 shadow-xl transition-all">
        
        <!-- Encabezado -->
        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
          <div>
            <h2 class="text-base font-bold text-slate-800">Reasignar Rol de Usuario</h2>
            <p class="text-xs text-slate-500 mt-0.5">
              {{ user?.name }} {{ user?.lastname }} ({{ user?.email }})
            </p>
          </div>
          <button
            type="button"
            (click)="onClose()"
            class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Selección de Rol -->
        <div class="py-5">
          <label class="block text-xs font-semibold text-slate-700 mb-2">
            Selecciona el nuevo rol:
          </label>
          
          <select
            [value]="selectedRole()"
            (change)="selectedRole.set($any($event.target).value)"
            class="w-full h-10 rounded-lg border border-slate-200 bg-slate-50/50 px-3 text-xs text-slate-700 outline-none focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition"
          >
            @for (role of availableRoles; track role) {
              <option [value]="role">{{ role }}</option>
            }
          </select>
        </div>

        <!-- Acciones -->
        <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-100">
          <button
            type="button"
            (click)="onClose()"
            class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition"
          >
            Cancelar
          </button>
          <button
            type="button"
            (click)="onConfirm()"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-xs font-semibold text-white hover:bg-indigo-700 active:bg-indigo-800 shadow-sm transition"
          >
            Guardar Cambio
          </button>
        </div>

      </div>
    </div>
