<ui-modal title="Reasignar rol de usuario" [subtitle]="(user?.name ?? '') + ' ' + (user?.lastname ?? '') + ' (' + (user?.email ?? '') + ')'" (closed)="onClose()">
  <ui-form-field label="Seleccioná el nuevo rol" for="new-role">
    <select
      id="new-role"
      uiInput
      [value]="selectedRole()"
      (change)="selectedRole.set($any($event.target).value)"
    >
      @for (role of availableRoles; track role) {
        <option [value]="role">{{ roleLabel(role) }}</option>
      }
    </select>
  </ui-form-field>

  <ng-container ngProjectAs="[modal-footer]">
    <button uiButton variant="secondary" type="button" (click)="onClose()">Cancelar</button>
    <button uiButton type="button" (click)="onConfirm()">Guardar cambio</button>
  </ng-container>
</ui-modal>
