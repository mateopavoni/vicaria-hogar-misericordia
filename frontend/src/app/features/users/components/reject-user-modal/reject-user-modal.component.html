<ui-modal title="Rechazar solicitud" subtitle="Indicá el motivo por el cual se rechaza la solicitud." (closed)="closeModal()">
  @if (user) {
    <!-- USUARIO -->
    <div class="mb-5 rounded-xl bg-[#F7F8FC] px-4 py-3">
      <p class="text-[12px] font-bold text-slate-700">{{ user.name }} {{ user.lastname }}</p>
      <p class="mt-1 text-[10px] text-slate-400">{{ user.email }}</p>
    </div>

    <!-- MOTIVO -->
    <ui-form-field label="Motivo del rechazo" for="rejectionReason" [required]="true"
      [hint]="reason().trim().length === 0 ? 'El motivo es obligatorio.' : null">
      <textarea
        id="rejectionReason"
        uiInput
        rows="4"
        [value]="reason()"
        (input)="updateReason($any($event.target).value)"
        placeholder="Escribí el motivo del rechazo..."
        class="resize-none"
      ></textarea>
    </ui-form-field>
  }

  <ng-container ngProjectAs="[modal-footer]">
    <button uiButton variant="secondary" type="button" (click)="closeModal()">Cancelar</button>
    <button uiButton variant="danger" type="button" [disabled]="!reason().trim()" (click)="rejectUser()">
      Rechazar solicitud
    </button>
  </ng-container>
</ui-modal>
