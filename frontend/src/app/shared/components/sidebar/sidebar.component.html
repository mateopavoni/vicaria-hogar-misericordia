
<aside
  class="fixed left-0 top-0 z-40 flex h-screen w-[218px] flex-col
         border-r border-slate-100 bg-white"
>
  <!-- Logo -->
<div class="flex h-[110px] items-center px-7">
  <div class="mt-4 flex items-center gap-3">

    <img
      src="assets/Logo-NuestraSeniora.png"
      alt="Nuestra Señora de la Misericordia"
      class="h-[92px] w-[52px] object-contain"
    />

    <div
      class="whitespace-nowrap font-serif text-[15px] leading-tight text-blue-600"
    >
      <span class="block">Nuestra Señora de</span>
      <span class="block">la Misericordia</span>
    </div>

  </div>
</div>
  <!-- Navegación -->
  <nav class="flex-1 px-4 pt-10">

    <!-- Inicio -->
    <a
      routerLink="/inicio"
      routerLinkActive="bg-indigo-100 text-indigo-500"
      [routerLinkActiveOptions]="{ exact: true }"
      class="mb-3 flex h-[46px] items-center gap-4 rounded-lg
            border border-transparent
            px-6 text-sm font-semibold text-slate-700
            transition-all duration-200
            hover:border-[#B8C8FA]
            hover:bg-[#F5F7FF]
            hover:text-[#6689F5]"
        >
      <svg
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path d="m3 10 9-8 9 8"></path>
        <path d="M5 10v10h14V10"></path>
        <path d="M9 20v-6h6v6"></path>
      </svg>

      <span>Inicio</span>

        <path d="M14 2v5h5"></path>
        <path d="M8 13h8"></path>
        <path d="M8 17h5"></path>

      <span>Fichas</span>

      class="mb-3 flex h-[46px] items-center gap-4 rounded-lg

      <svg

        stroke="currentColor"
        stroke-width="2"
