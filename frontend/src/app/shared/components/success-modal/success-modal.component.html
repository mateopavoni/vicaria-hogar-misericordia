<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
  <div class="w-full max-w-sm rounded-xl bg-white p-6 shadow-xl border border-slate-200 text-center">
    
    <!-- ÍCONO CHECK VERDE -->
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <!-- TÍTULO Y MENSAJE DINÁMICOS -->
    <h3 class="text-base font-bold text-slate-800">{{ title() }}</h3>
    <p class="mt-2 text-xs text-slate-500">
      {{ message() }}
    </p>

    <!-- BOTÓN DE CIERRE -->
    <div class="mt-6">
      <button
        type="button"
        (click)="close.emit()"
        class="w-full rounded-lg bg-[#4167D9] px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-[#3155C7] transition"
      >
        {{ buttonText() }}
      </button>
    </div>

  </div>
</div>
