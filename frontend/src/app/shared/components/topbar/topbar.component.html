
<header
  class="fixed left-[218px] right-0 top-0 z-30
         flex h-[104px] items-center
         border-b border-slate-100 bg-white
         px-8"
>
  <!-- Selector de hogar -->
  <button
    type="button"
    class="flex h-[40px] items-center gap-3 rounded-lg
           border border-indigo-200 bg-white
           px-3 text-sm font-medium text-slate-700
           transition-colors 
           hover:border-[#B8C8FA]
          hover:bg-[#F5F7FF]
          hover:text-[#6689F5]"
  >

    <!-- Icono Home -->
    <svg
      class="h-5 w-5 text-indigo-500"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path d="m3 10 9-8 9 8"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>

    <span>
      Hogar actual: Centro Barrial
    </span>

    <!-- Flecha -->
    <svg
      class="h-4 w-4 text-slate-700"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path d="m6 9 6 6 6-6"></path>
    </svg>

  </button>

  
  
  <!-- Usuario -->
  <div class="ml-auto flex items-center gap-4">

    @if (authService.user(); as user) {
    <!-- Nombre y Rol dinámicos -->
    <div class="flex flex-col text-right">
      <span class="text-base font-medium text-slate-900">
        ¡Hola, {{ user.name }}!
      </span>
      <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wide">
        {{ user.role }}
      </span>
    </div>

    <div
      class="flex h-8 w-8 items-center justify-center
             rounded-full bg-indigo-500"
    >
      <svg
        class="h-5 w-5 text-white"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21a8 8 0 0 1 16 0"></path>
      </svg>
    </div>
  }
  <!-- Notificaciones -->
  <app-notification-menu></app-notification-menu>
  
  </div>
</header>
